name: Go reusable

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go mod verify
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
